NAME: redo
FULL_NAME: "Python Command Repeater"
VERSION: "0.2.1"
DESCRIPTION: >
  Repeat any shell command a specified number of times with optional interval,
  stop-on-failure, quiet, and listen modes. Supports infinite execution with
  -t 0 or -l. Prints per-run status with timing and a summary line with
  execution count, total time, average, min, and max. Pure Python, stdlib only.
USAGE:
  - "redo 'command' -t N"
  - "redo 'command' -t N -i S"
  - "redo 'command' -t 0"
  - "redo 'command' -l"
  - "redo 'command' -l -t 5"
  - "redo -t N -i S 'command'"
  - "redo 'command' -t N -s"
  - "redo 'command' -t N -q"
OPTIONS:
  - "-h, --help              Show help message"
  - "-v, --version           Show version information"
  - "-t N                    Number of times to repeat (0 = infinite, default: 1)"
  - "-i S                    Interval in seconds between runs (default: 1)"
  - "-l                      Listen mode: wait for Enter between runs (q to quit)"
  - "-s                      Stop on first failure"
  - "-q                      Quiet mode, only show summary"
EXAMPLES:
  - "redo 'curl -s google.com' -t 5           # 5 times, no delay"
  - "redo 'curl -s google.com' -t 20 -i 5     # 20 times, 5s apart"
  - "redo 'curl -s google.com' -t 0           # infinite, Ctrl+C to stop"
  - "redo 'curl -s google.com' -t 0 -i 2      # infinite, 2s apart"
  - "redo 'make test' -l                      # listen: Enter to repeat, q to quit"
  - "redo 'make test' -l -t 5                 # listen, capped at 5"
  - "redo 'make test' -t 10 -s                # 10 times, stop on fail"
  - "redo 'ping -c1 8.8.8.8' -t 100 -i 1 -q   # 100 pings, quiet"
  - "redo -t 3 -i 2 'python script.py'        # flags first"
OUTPUT: >
  Per-run lines showing [N/total] with checkmark or cross, elapsed time, and
  exit code on failure. Final summary line with pass/fail ratio, total time,
  average, min, and max durations.
AUTHOR: "@spacemany2k38"
DATE: "2026-05-03"
